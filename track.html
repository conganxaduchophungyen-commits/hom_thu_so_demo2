<!doctype html><html lang="vi"><head><meta charset="utf-8"><?!= include('styles'); ?></head><body><header class="topbar"><div class="brand"><div class="seal">CA</div><div><div class="brand-title">HÒM THƯ TỐ GIÁC TỘI PHẠM SỐ</div><div class="brand-sub">CÔNG AN XÃ ĐỨC HỢP • CÔNG AN TỈNH HƯNG YÊN</div></div></div><nav class="nav"><div class="nav-inner"><a href="?page=index">⌂ TRANG CHỦ</a><a href="?page=citizen">⚠ GỬI TỐ GIÁC / PHẢN ÁNH</a><a class="active" href="?page=track">⌕ TRA CỨU HỒ SƠ</a></div></nav></header><main class="wrap"><div class="login-card card"><div class="eyebrow">TRA CỨU CÔNG KHAI</div><h1 style="color:var(--navy);font-size:21px">Tra cứu hồ sơ</h1><div class="field"><label>Mã hồ sơ</label><input id="caseId" placeholder="DH-2026-000001"></div><div class="field"><label>Mã tra cứu</label><input id="tracking" placeholder="DHT-XXXXXXXXXXXX"></div><button class="btn btn-primary" style="width:100%" onclick="track()">TRA CỨU</button><div id="out" style="margin-top:15px"></div></div></main><div id="toast" class="toast"></div><script><?!= include('javascript'); ?>async function track(){try{const r=await apiCall('trackPublicCase',{caseId:caseId.value.trim(),publicTrackingCode:tracking.value.trim()});out.innerHTML=`<div class="notice success"><b>${esc(r.caseId)}</b><br>Trạng thái: ${badge(r.status)}<br>Loại: ${esc(r.category)}<br>Mức độ: ${esc(r.priority)}<br>Cập nhật: ${esc(fmtDate(r.updatedAt))}</div>`}catch(e){out.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}</script></body></html>
