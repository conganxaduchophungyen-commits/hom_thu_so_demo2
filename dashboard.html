<!doctype html><html lang="vi"><head><meta charset="utf-8"><?!= include('styles'); ?></head><body><header class="topbar"><div class="brand"><div class="seal">CA</div><div><div class="brand-title">HÒM THƯ TỐ GIÁC TỘI PHẠM SỐ</div><div class="brand-sub">BẢNG ĐIỀU HÀNH CÁN BỘ</div></div><div class="hotline"><span id="who"></span><br><button class="btn btn-secondary" style="padding:4px 8px;font-size:10px" onclick="logout()">Đăng xuất</button></div></div><nav class="nav"><div class="nav-inner"><a class="active" href="?page=dashboard">▣ DASHBOARD</a><a href="?page=case-detail">▤ HỒ SƠ</a><a href="?page=admin">⚙ QUẢN TRỊ</a><a href="?page=index">⌂ TRANG CÔNG KHAI</a></div></nav></header><main class="wrap"><div class="stats" id="stats"></div><div class="card" style="margin-top:14px"><div class="section-title"><div><div class="eyebrow">QUẢN LÝ HỒ SƠ</div><h2>Danh sách tin báo</h2></div><button class="btn btn-primary" onclick="loadCases()">↻ Làm mới</button></div><div class="two"><div class="field"><label>Tìm kiếm</label><input id="q" placeholder="Mã hồ sơ, nội dung, địa điểm..."></div><div class="field"><label>Trạng thái</label><select id="status"><option value="">Tất cả</option>${Object.entries(STATUS_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Mã hồ sơ</th><th>Ngày</th><th>Loại</th><th>Mức độ</th><th>Thôn</th><th>Trạng thái</th><th>Deadline</th></tr></thead><tbody id="cases"></tbody></table></div><div id="pages" style="margin-top:12px"></div></div><div class="dashboard-grid"><div class="card"><div class="section-title"><h2>Theo loại thông tin</h2></div><div id="byCategory"></div></div><div class="card"><div class="section-title"><h2>Theo địa bàn</h2></div><div id="byVillage"></div></div></div></main><div id="toast" class="toast"></div><script><?!= include('javascript'); ?>const s=requireLogin();if(s){who.textContent=s.fullName+' • '+s.role;loadCases();loadDash()}async function logout(){await api('logoutUser',{token:session().token});clearSession();go('login')}async function loadCases(page=1){try{const r=await apiCall('searchCases',{token:s.token,page:page,pageSize:20,filters:{q:q.value,status:status.value}});cases.innerHTML=r.items.map(c=>`<tr onclick="goCase('${esc(c.caseId)}')" style="cursor:pointer"><td><b>${esc(c.caseId)}</b></td><td>${esc(c.createdAt)}</td><td>${esc(c.category)}</td><td>${esc(c.priority)}</td><td>${esc(c.village)}</td><td>${badge(c.status)}</td><td>${c.daysLeft==null?'—':(c.daysLeft<0?'<span class="badge red">Quá hạn</span>':c.daysLeft+' ngày')}</td></tr>`).join('')||'<tr><td colspan="7">Không có dữ liệu.</td></tr>';pages.innerHTML=Array.from({length:r.pages},(_,i)=>`<button class="btn ${i+1===r.page?'btn-primary':'btn-secondary'}" style="padding:5px 8px;margin:2px" onclick="loadCases(${i+1})">${i+1}</button>`).join('')}catch(e){toast(e.message)}}function goCase(id){location.href='?page=case-detail&caseId='+encodeURIComponent(id)}async function loadDash(){try{const r=await apiCall('getDashboard',{token:s.token});stats.innerHTML=[['Tổng hồ sơ',r.stats.total],['Mới hôm nay',r.stats.today],['Đang xử lý',r.stats.processing],['Quá hạn',r.stats.overdue],['Khẩn cấp',r.stats.urgent],['Chưa phân công',r.stats.unassigned],['Đã xử lý',r.stats.resolved],['Trong tháng',r.stats.month]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');bar('byCategory',r.byCategory);bar('byVillage',r.byVillage)}catch(e){toast(e.message)}}function bar(id,obj){const vals=Object.entries(obj),max=Math.max(1,...vals.map(x=>x[1]));document.getElementById(id).innerHTML=vals.map(([k,v])=>`<div class="bar-row"><div class="bar-label"><span>${esc(CAT_LABELS[k]||k)}</span><b>${v}</b></div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div></div>`).join('')}</script></body></html>
