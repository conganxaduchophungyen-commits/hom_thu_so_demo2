<!doctype html><html lang="vi"><head><meta charset="utf-8"><?!= include('styles'); ?></head><body><header class="topbar"><div class="brand"><div class="seal">CA</div><div><div class="brand-title">HÒM THƯ TỐ GIÁC TỘI PHẠM SỐ</div><div class="brand-sub">CHI TIẾT HỒ SƠ</div></div></div></div><nav class="nav"><div class="nav-inner"><a href="?page=dashboard">▣ DASHBOARD</a><a class="active" href="?page=case-detail">▤ HỒ SƠ</a><a href="?page=admin">⚙ QUẢN TRỊ</a></div></nav></header><main class="wrap" id="app"></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modal-card" id="modalBody"></div></div><script><?!= include('javascript'); ?>const s=requireLogin();const caseId=new URLSearchParams(location.search).get('caseId');let detail;load();async function load(){if(!caseId)return app.innerHTML='<div class="card">Thiếu mã hồ sơ.</div>';try{detail=await apiCall('getCaseDetail',{token:s.token,caseId});render()}catch(e){app.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}function render(){const c=detail.case;app.innerHTML=`<div class="section-title"><div><div class="eyebrow">HỒ SƠ ${esc(c.caseId)}</div><h1 style="color:var(--navy);margin:4px 0">${esc(detail.categoryLabel)}</h1></div><div>${badge(c.status)}</div></div><div class="detail-grid"><div><div class="card"><h3>Thông tin chung</h3><div class="kv"><b>Mã hồ sơ</b><span>${esc(c.caseId)}</span></div><div class="kv"><b>Tiếp nhận</b><span>${esc(fmtDate(c.createdAt))}</span></div><div class="kv"><b>Mức độ</b><span>${esc(detail.priorityLabel)}</span></div><div class="kv"><b>Địa điểm</b><span>${esc(c.incidentLocation||'—')} / ${esc(c.village||'—')}</span></div><div class="kv"><b>Deadline</b><span>${c.deadline?fmtDate(c.deadline):'Chưa cấu hình'} ${detail.daysLeft!=null?'('+detail.daysLeft+' ngày)':''}</span></div></div><div class="card" style="margin-top:14px"><h3>Nội dung</h3><p style="white-space:pre-wrap;line-height:1.6">${esc(c.description)}</p></div><div class="card" style="margin-top:14px"><h3>Kết quả</h3><textarea id="resolution" style="width:100%;min-height:100px">${esc(c.resolution||'')}</textarea><div class="actions"><button class="btn btn-secondary" onclick="note()">Thêm ghi chú</button><button class="btn btn-primary" onclick="changeStatus()">Cập nhật trạng thái</button></div></div></div><aside><div class="card"><h3>Phân công</h3><p>${esc(c.assignedTo||'Chưa phân công')}</p><button class="btn btn-navy" onclick="assign()">Phân công / điều chuyển</button></div><div class="card" style="margin-top:14px"><h3>Người cung cấp</h3><p>${c.anonymous?'Ẩn danh':esc(c.reporterName||'—')}</p><p>${c.anonymous?'':esc(c.reporterPhone||'')}</p><p>${c.anonymous?'':esc(c.reporterEmail||'')}</p></div><div class="card" style="margin-top:14px"><h3>Lịch sử xử lý</h3><div class="timeline">${detail.history.map(h=>`<div class="timeline-item"><b>${esc(h.action)}</b><small>${esc(fmtDate(h.performedAt))} • ${esc(h.performedBy)}</small><p>${esc(h.reason)} ${esc(h.note)}</p></div>`).join('')}</div></div></aside></div>`}async function changeStatus(){const to=prompt('Trạng thái mới (ví dụ PROCESSING, VERIFYING, RESOLVED, CLOSED):',detail.case.status);if(!to)return;try{await apiCall('updateCaseStatus',{token:s.token,caseId:caseId,toStatus:to.toUpperCase(),reason:'Cập nhật từ hồ sơ',note:resolution.value});toast('Đã cập nhật');load()}catch(e){toast(e.message)}}async function note(){const n=prompt('Nhập ghi chú nghiệp vụ:');if(!n)return;try{await apiCall('addCaseNote',{token:s.token,caseId:caseId,note:n});load()}catch(e){toast(e.message)}}async function assign(){const users=await apiCall('listUsers',{token:s.token});const active=users.filter(u=>u.status==='ACTIVE');const val=prompt('Nhập userId cán bộ:\n'+active.map(u=>u.userId+' - '+u.fullName).join('\n'));if(!val)return;try{await apiCall('assignCase',{token:s.token,caseId:caseId,userId:val.trim()});load()}catch(e){toast(e.message)}}</script></body></html>
