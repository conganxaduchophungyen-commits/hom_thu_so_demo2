<!doctype html><html lang="vi"><head><meta charset="utf-8"><?!= include('styles'); ?></head><body><header class="topbar"><div class="brand"><div class="seal">CA</div><div><div class="brand-title">HÒM THƯ TỐ GIÁC TỘI PHẠM SỐ</div><div class="brand-sub">QUẢN TRỊ HỆ THỐNG</div></div></div><nav class="nav"><div class="nav-inner"><a href="?page=dashboard">▣ DASHBOARD</a><a class="active" href="?page=admin">⚙ QUẢN TRỊ</a><a href="?page=index">⌂ TRANG CÔNG KHAI</a></div></nav></header><main class="wrap"><div class="card"><div class="section-title"><div><div class="eyebrow">QUẢN LÝ TÀI KHOẢN</div><h2>Cán bộ & phân quyền</h2></div><button class="btn btn-primary" onclick="editUser()">+ Tạo tài khoản</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th><th>Thôn phụ trách</th><th>Trạng thái</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card" style="margin-top:14px"><h2>Bảo trì hệ thống</h2><div class="actions" style="justify-content:flex-start"><button class="btn btn-navy" onclick="runTest()">Chạy Test Suite</button><button class="btn btn-secondary" onclick="deadline()">Kiểm tra Deadline</button></div><div id="result" style="margin-top:12px"></div></div></main><div id="toast" class="toast"></div><script><?!= include('javascript'); ?>const s=requireLogin();if(s)loadUsers();async function loadUsers(){try{const r=await apiCall('listUsers',{token:s.token});users.innerHTML=r.map(u=>`<tr><td><b>${esc(u.loginName)}</b></td><td>${esc(u.fullName)}</td><td>${esc(u.role)}</td><td>${esc(u.villages||'')}</td><td>${esc(u.status)}</td><td><button class="btn btn-secondary" style="padding:5px" onclick="editUser('${u.userId}')">Sửa</button> <button class="btn btn-danger" style="padding:5px" onclick="resetPwd('${u.userId}')">Reset</button> <button class="btn btn-danger" style="padding:5px" onclick="delUser('${u.userId}')">Vô hiệu</button></td></tr>`).join('')}catch(e){toast(e.message)}}async function editUser(id){const u=id?(await apiCall('listUsers',{token:s.token})).find(x=>x.userId===id):{};const fullName=prompt('Họ tên:',u.fullName||'');if(!fullName)return;const loginName=prompt('Tài khoản đăng nhập:',u.loginName||'');if(!loginName)return;const role=prompt('Vai trò (SUPER_ADMIN/ADMIN/LEAD/INTAKE/PROCESSOR/VIEWER):',u.role||'PROCESSOR');const email=prompt('Email:',u.email||'');const villages=prompt('Thôn phụ trách, ngăn cách bằng dấu phẩy:',u.villages||'');const password=prompt('Mật khẩu mới (bỏ trống nếu giữ nguyên; tạo mới mặc định 1):','');try{await apiCall('saveUser',{token:s.token,user:{userId:id,fullName,loginName,role,email,villages,password}});loadUsers()}catch(e){toast(e.message)}}async function resetPwd(id){if(!confirm('Reset mật khẩu về 1?'))return;try{await apiCall('resetUserPassword',{token:s.token,userId:id});toast('Đã reset.');loadUsers()}catch(e){toast(e.message)}}async function delUser(id){if(!confirm('Vô hiệu hóa tài khoản?'))return;try{await apiCall('deleteUser',{token:s.token,userId:id});loadUsers()}catch(e){toast(e.message)}}async function runTest(){try{const r=await apiCall('runAllTests',{token:s.token});result.innerHTML=`<div class="notice ${r.passed===r.total?'success':'error'}">Pass ${r.passed}/${r.total}<br>${r.results.map(x=>x.name+': '+(x.pass?'PASS':'FAIL '+x.error)).join('<br>')}</div>`}catch(e){toast(e.message)}}async function deadline(){try{const r=await apiCall('runDeadlineCheck',{token:s.token});result.innerHTML='<div class="notice success">Đã kiểm tra '+r.checked+' hồ sơ, cảnh báo '+r.warned+'.</div>'}catch(e){toast(e.message)}}</script></body></html>
