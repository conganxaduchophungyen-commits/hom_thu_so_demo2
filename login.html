<!doctype html><html lang="vi"><head><meta charset="utf-8"><?!= include('styles'); ?></head><body><header class="topbar"><div class="brand"><div class="seal">CA</div><div><div class="brand-title">HÒM THƯ TỐ GIÁC TỘI PHẠM SỐ</div><div class="brand-sub">CỔNG CÁN BỘ • CÔNG AN XÃ ĐỨC HỢP</div></div></div></header><main class="wrap"><div class="login-card card"><div class="eyebrow">KHU VỰC NỘI BỘ</div><h1 style="color:var(--navy);font-size:21px">Đăng nhập cán bộ</h1><div class="field"><label>Tài khoản</label><input id="loginName" autocomplete="username"></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn btn-primary" style="width:100%" onclick="login()">ĐĂNG NHẬP</button><div id="msg" style="margin-top:12px"></div><div class="notice" style="margin-top:14px">Tài khoản quản trị ban đầu: <b>admin</b>. Mật khẩu khởi tạo theo cấu hình triển khai là <b>admin@123</b>; cần đổi ngay sau đăng nhập lần đầu.</div></div></main><div id="toast" class="toast"></div><script><?!= include('javascript'); ?>async function login(){try{const r=await apiCall('loginUser',{loginName:loginName.value,password:password.value});setSession(r.session);if(r.user.mustChangePassword){msg.innerHTML='<div class="notice">Tài khoản yêu cầu đổi mật khẩu lần đầu. Bạn sẽ được chuyển vào Dashboard để thực hiện.</div>'}setTimeout(()=>go('dashboard'),400)}catch(e){msg.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}</script></body></html>
